<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ขอความช่วยเหลือ - MindCare</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Kanit', sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            background-color: #2c3e50;
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            flex-wrap: wrap;
            gap: 10px;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            white-space: nowrap;
        }
        .menu {
            display: flex;
            gap: 15px;
            align-items: center;
            overflow-x: auto;
            padding-bottom: 5px;
        }
        .menu a {
            font-size: 0.95rem;
            font-weight: normal;
            transition: color 0.3s;
        }
        .menu a:hover {
            color: #1abc9c;
        }
        .btn-nav {
            background-color: #1abc9c;
            padding: 6px 12px;
            border-radius: 5px;
        }
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .chat-container {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            height: 75vh;
            max-height: 600px;
            min-height: 400px;
            overflow: hidden;
        }
        .chat-header {
            background-color: #34495e;
            color: white;
            padding: 15px 18px;
            font-size: 1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background-color: #fafafa;
        }
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 0.9rem;
            line-height: 1.4;
            word-wrap: break-word;
        }
        .bot-message {
            background-color: #e8f4f8;
            color: #2c3e50;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .user-message {
            background-color: #1abc9c;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .chat-input-area {
            display: flex;
            padding: 10px 12px;
            background-color: white;
            border-top: 1px solid #eee;
            gap: 8px;
            align-items: center;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 0.9rem;
        }
        .chat-input-area input:focus {
            border-color: #1abc9c;
        }
        .chat-input-area button {
            background-color: #1abc9c;
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1rem;
            flex-shrink: 0;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <a href="index.html"><i class="fa-solid fa-heart-pulse"></i> MindCare</a>
        <div class="menu">
            <a href="index.html">หน้าแรก</a>
            <a href="what-is-depression.html">โรคซึมเศร้าคืออะไร</a>
            <a href="symptoms.html">อาการ</a>
            <a href="causes.html">สาเหตุ</a>
            <a href="self-care.html">การดูแลตัวเอง</a>
            <a href="help.html" class="btn-nav">ขอความช่วยเหลือ</a>
        </div>
    </nav>

    <div class="main-container">
        <div class="chat-container">
            <div class="chat-header">
                <i class="fa-solid fa-robot"></i> MindCare AI Assistant
            </div>

            <div class="chat-box" id="chatBox">
                <div class="message bot-message">
                    สวัสดีครับ! ผมเป็น AI ผู้ช่วยรับฟังและให้คำปรึกษาด้านสุขภาพจิตเบื้องต้น สามารถพูดคุยหรือระบายความรู้สึกได้เลยครับ
                </div>
            </div>

            <div class="chat-input-area">
                <input type="text" id="userInput" placeholder="พิมพ์ข้อความคุยกับ AI..." onkeypress="handleKeyPress(event)">
                <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const userInput = document.getElementById('userInput');

        const aiReplies = [
            "เข้าใจความรู้สึกของคุณเลยนะครับ การเผชิญกับเรื่องเครียดๆ ไม่ใช่เรื่องง่ายเลย อยากเล่าให้ผมฟังเพิ่มเติมไหมครับ?",
            "ขอบคุณที่กล้าเปิดใจและพูดคุยกับผมนะครับ จำไว้นะครับว่าคุณไม่ได้เผชิญปัญหานี้อยู่คนเดียวแน่นอน พักผ่อนและดูแลตัวเองเยอะๆนะครับ",
            "ผมรับฟังเสมอนะครับ บางครั้งการมีความรู้สึกแบบนี้เป็นเรื่องปกติ ลองหายใจเข้าลึกๆ ช้าๆ ดูนะครับ ทุกอย่างจะค่อยๆ ดีขึ้นครับ",
            "หากช่วงนี้รู้สึกเหนื่อยล้ามากๆ อย่าลืมแบ่งเวลาให้ตัวเองได้พักผ่อน หรือทำกิจกรรมที่ชอบบ้างนะครับ เป็นกำลังใจให้ครับ!",
            "ผมเข้าใจว่าคุณอาจจะกำลังเผชิญกับช่วงเวลาที่ยากลำบาก ถ้าไม่ไหวจริงๆ สามารถโทรปรึกษาสายด่วนสุขภาพจิต 1323 (โทรฟรีตลอด 24 ชม.) ได้เลยนะครับ ผมเป็นห่วงครับ"
        ];

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            appendMessage(text, 'user-message');
            userInput.value = '';

            const loadingDiv = appendMessage("กำลังพิมพ์...", 'bot-message');

            setTimeout(() => {
                const randomReply = aiReplies[Math.floor(Math.random() * aiReplies.length)];
                
                if (text.includes("เครียด") || text.includes("ไม่ไหว") || text.includes("เศร้า") || text.includes("ตาย") || text.includes("kill")) {
                    loadingDiv.innerText = "ผมรับรู้ได้ถึงความอึดอัดใจที่คุณกำลังเจออยู่นะครับ อยากแนะนำให้ลองพูดคุยกับผู้เชี่ยวชาญผ่านสายด่วนสุขภาพจิต 1323 ดูนะครับ โทรฟรีตลอด 24 ชั่วโมงเลยครับ เป็นห่วงนะครับ";
                } else {
                    loadingDiv.innerText = randomReply;
                }
            }, 800);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.innerText = text;
            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
            return msgDiv;
        }
    </script>
</body>
</html>
