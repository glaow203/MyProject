<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant - MindCare</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/css/font-awesome/6.0.0/css/all.min.css">
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .chat-container {
      width: 100%;
      max-width: 450px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 600px;
    }
    .chat-header {
      background: #4A90E2;
      color: white;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
    }
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.95rem;
      line-height: 1.4;
      white-space: pre-wrap;
    }
    .bot-message {
      background: #e9ecef;
      color: #333;
      align-self: flex-start;
      border-bottom-left-radius: 2px;
    }
    .user-message {
      background: #4A90E2;
      color: white;
      align-self: flex-end;
      border-bottom-right-radius: 2px;
    }
    .chat-input-area {
      display: flex;
      padding: 12px;
      background: #fff;
      border-top: 1px solid #eee;
    }
    .chat-input-area input {
      flex: 1;
      border: 1px solid #ccc;
      padding: 10px 14px;
      border-radius: 20px;
      outline: none;
    }
    .chat-input-area button {
      background: #4A90E2;
      color: white;
      border: none;
      padding: 10px 16px;
      margin-left: 8px;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <i class="fa-solid fa-robot"></i> MindCare AI Assistant
  </div>
  
  <div class="chat-box" id="chatBox">
    <div class="message bot-message">
      สวัสดีครับ ผมเป็น AI ผู้ช่วยรับฟังและรับมือปัญหาสุขภาพจิตเบื้องต้น สามารถพูดคุยหรือปรึกษาปัญหาความเครียดและสุขภาพใจกับผมได้เลยครับ
    </div>
  </div>

  <div class="chat-input-area">
    <input type="text" id="userInput" placeholder="พิมพ์ข้อความคุยกับ AI..." onkeypress="handleKeyPress(event)">
    <button onclick="sendMessage()"><i class="fa-solid fa-paper-plane"></i></button>
  </div>
</div>

<script>
  // ⚠️ ใส่ API Key ของคุณที่นี่
  const GEMINI_API_KEY = "AQ.Ab8RN6I1-S9E_i4WEqpinT8VOkja0Vlc7j_Pc5cJNvrybfBLlQ"; 

  const chatBox = document.getElementById('chatBox');
  const userInput = document.getElementById('userInput');

  async function sendMessage() {
    const text = userInput.value.trim();
    if (!text) return;

    appendMessage(text, 'user-message');
    userInput.value = '';

    // สร้างข้อความรอโหลด
    const loadingDiv = appendMessage("กำลังคิดคำตอบ...", 'bot-message');

    try {
      const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          contents: [{
            parts: [{
              text: `คุณคือผู้ช่วยรับฟังปัญหาสุขภาพจิตประจำเว็บ MindCare ตอบด้วยความเห็นอกเห็นใจ ใช้วาจาสุภาพ นุ่มนวล และเน้นการให้กำลังใจ ความยาวคำตอบไม่ยาวเกินไป หากผู้ใช้อยู่ในภาวะเสี่ยงสูงให้แนะนำให้โทรสายด่วนสุขภาพจิต 1323 ข้อความผู้ใช้: ${text}`
            }]
          }]
        })
      });

      const data = await response.json();
      const aiReply = data.candidates?.[0]?.content?.parts?.[0]?.text || "ขออภัยครับ ระบบประมวลผลขัดข้อง ลองใหม่อีกครั้งนะครับ";
      loadingDiv.innerText = aiReply;
    } catch (error) {
      console.error(error);
      loadingDiv.innerText = "เกิดข้อผิดพลาดในการเชื่อมต่อกับ AI";
    }
  }

  function handleKeyPress(e) {
    if (e.key === 'Enter') sendMessage();
  }

  function appendMessage(text, className) {
    const msgDiv = document.createElement('div');
    msgDiv.className = `message ${className}`;
    msgDiv.innerText = text;
    chatBox.appendChild(msgDiv);
    chatBox.scrollTop = chatBox.scrollHeight;
    return msgDiv;
  }
</script>

</body>
</html>
